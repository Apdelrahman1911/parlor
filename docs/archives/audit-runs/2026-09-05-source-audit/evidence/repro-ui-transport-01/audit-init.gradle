// Audit test additions are explicit invocation-only; dependencies unchanged.
def auditSourceDirs = [
    ':shared:transport-p2p': ['desktopTest', 'transport'],
    ':composeApp': ['desktopTest', 'app']
]
gradle.beforeProject { p ->
    def entry = auditSourceDirs[p.path]
    if (entry != null) p.pluginManager.withPlugin('org.jetbrains.kotlin.multiplatform') {
        p.extensions.getByName('kotlin').sourceSets.getByName(entry[0]).kotlin.srcDir(
            new File(p.rootProject.projectDir, 'audit-runs/2026-09-05-source-audit/reproducers/' + entry[1])
        )
    }
}
gradle.projectsEvaluated {
    rootProject.tasks.register('auditResolvedDependencies') {
        doLast {
            [':game-modes:mafia': ['desktopCompileClasspath'], ':composeApp': ['desktopCompileClasspath', 'releaseCompileClasspath']].each { path, names ->
                def p = rootProject.project(path)
                names.each { name ->
                    def c = p.configurations.findByName(name)
                    if (c == null || !c.canBeResolved) {
                        println("AUDIT_RESOLUTION_UNAVAILABLE ${path}:${name}; candidates=" + p.configurations.findAll { it.canBeResolved }*.name)
                    } else {
                        println("AUDIT_RESOLUTION_BEGIN ${path}:${name}")
                        c.incoming.resolutionResult.allComponents.collect { it.id.displayName }.sort().each {
                            println("AUDIT_RESOLVED ${path}:${name} ${it}")
                        }
                        c.incoming.resolutionResult.allDependencies.findAll { it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult }.each { throw new GradleException("Unresolved audited dependency: " + it.requested.displayName, it.failure) }
                    }
                }
            }
        }
    }
}
