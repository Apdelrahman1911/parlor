name: iOS protection native negative tests (not protection qualification)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parlor-protection-native-negative-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  ios:
    name: Execute four new candidate native negative regressions
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Check out frozen unqualified protection candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1df4273bd9edeec3c8537892faf5b4b66871bdce
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Restore reviewed dependencies without saving diagnostic state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Claim fresh output ownership
        id: ownership
        run: python3 -B -m scripts.ci.verification_hygiene prepare
      - name: Record exact candidate and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1df4273bd9edeec3c8537892faf5b4b66871bdce
          test -z "$(git status --porcelain)"
          mkdir -p build/ci-evidence
          git rev-parse HEAD HEAD^{tree} | tee build/ci-evidence/source.txt
          git ls-tree -r HEAD > build/ci-evidence/source-tree.txt
          xcodebuild -version | tee build/ci-evidence/xcode-version.txt
          test "$(sed -n '1p' build/ci-evidence/xcode-version.txt)" = 'Xcode 26.3'
          test "$(sed -n '2p' build/ci-evidence/xcode-version.txt)" = 'Build version 17C529'
          xcrun --sdk iphonesimulator --show-sdk-version > build/ci-evidence/sdk-version.txt
          shasum -a 256 AGENTS.md > build/ci-evidence/agents.sha256
          test "$(cut -d' ' -f1 build/ci-evidence/agents.sha256)" = d9505fa9e8338a8a1ca85a63e87ffc72a4a0013468116f6f6d7a5c4c7dfbc02b
      - name: Claim owned native compilation cycle
        id: aggregate_prepare
        run: python3 -B -m scripts.ci.apple_verification_hygiene prepare apple-aggregate
      - name: Link candidate native test executable
        id: aggregate_run
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:linkDebugTestIosSimulatorArm64 \
            --dependency-verification=strict --no-daemon --max-workers=2 \
            --stacktrace --console=plain | tee build/ci-evidence/native-link.log
      - name: Stop compilation workers
        id: aggregate_finish
        if: always()
        env:
          PARLOR_APPLE_PREPARE_OUTCOME: ${{ steps.aggregate_prepare.outcome }}
          PARLOR_APPLE_RUN_OUTCOME: ${{ steps.aggregate_run.outcome }}
        run: python3 -B -m scripts.ci.apple_verification_hygiene finish apple-aggregate
      - name: Claim isolated native test cycle
        id: ui_prepare
        run: python3 -B -m scripts.ci.apple_verification_hygiene prepare apple-ui
      - name: Execute only four new native regressions on a fresh owned simulator
        id: ui_run
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 -B -m scripts.ci.apple_verification_hygiene create-simulator apple-ui)"
          export PARLOR_NEGATIVE_SIMULATOR="$simulator_udid"
          cat > build/ci-evidence/owned-native-test.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              if (gradle.rootProject.name != 'parlor') return
              def app = gradle.rootProject.project(':composeApp')
              app.tasks.named('iosSimulatorArm64Test').configure {
                  device.set(System.getenv('PARLOR_NEGATIVE_SIMULATOR'))
                  doFirst { println('Owned native negative simulator: ' + device.get()) }
              }
          }
          GRADLE
          ./gradlew :composeApp:iosSimulatorArm64Test \
            --tests 'com.parlor.app.storage.IosCompleteSnapshotProtectionTest.*' \
            --tests 'com.parlor.app.storage.IosStorageSafetyTest.explicitDiscardRemovesBothCopiesWithoutInitializingProtection' \
            --init-script build/ci-evidence/owned-native-test.init.gradle \
            --dependency-verification=strict --no-daemon --max-workers=2 \
            --stacktrace --console=plain | tee build/ci-evidence/native-negative-tests.log
          # No positive metadata, general functional, physical lock, or full gate claim.
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          expected = {
              ('com.parlor.app.storage.IosCompleteSnapshotProtectionTest', 'aMissingFileCannotBeQualifiedByMissingMetadata'),
              ('com.parlor.app.storage.IosCompleteSnapshotProtectionTest', 'aRejectedProtectionSetterCannotCreateOrQualifyAMissingItem'),
              ('com.parlor.app.storage.IosCompleteSnapshotProtectionTest', 'anUnprotectedFileCannotBeQualifiedByASuccessfulWrite'),
              ('com.parlor.app.storage.IosStorageSafetyTest', 'explicitDiscardRemovesBothCopiesWithoutInitializingProtection'),
          }
          expected = {(cls, name + '[iosSimulatorArm64]') for cls, name in expected}
          cases = [t for p in Path('composeApp/build/test-results/iosSimulatorArm64Test').glob('TEST-*.xml') for t in ET.parse(p).getroot().iter('testcase')]
          assert len(cases) == 4 and {(t.get('classname'), t.get('name')) for t in cases} == expected
          assert all(not any(t.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for t in cases)
          with Path('build/ci-evidence/focused-result.json').open('x') as out:
              json.dump(dict(result='PASS_FOUR_NATIVE_NEGATIVE_TESTS_ONLY', methods=sorted(expected), strict_complete_qualified=False, physical_verified=False, main_qualified=False), out, indent=2)
          PY
      - name: Retire owned native test workers and simulator
        id: ui_finish
        if: always()
        env:
          PARLOR_APPLE_PREPARE_OUTCOME: ${{ steps.ui_prepare.outcome }}
          PARLOR_APPLE_RUN_OUTCOME: ${{ steps.ui_run.outcome }}
        run: python3 -B -m scripts.ci.apple_verification_hygiene finish apple-ui
      - name: Retain actual source, executable, outcomes and custody
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-protection-native-negative-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/ci-evidence/
            composeApp/build/test-results/iosSimulatorArm64Test/
            composeApp/build/bin/iosSimulatorArm64/debugTest/
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-ios*.json
      - name: Clean only attested uploaded outputs
        id: cleanup
        if: always()
        env:
          PARLOR_VERIFICATION_PREPARE_OUTCOME: ${{ steps.ownership.outcome }}
          PARLOR_APPLE_CYCLE_OUTCOMES: >-
            {"apple-aggregate":{"prepare":"${{ steps.aggregate_prepare.outcome }}","run":"${{ steps.aggregate_run.outcome }}","finish":"${{ steps.aggregate_finish.outcome }}"},
             "apple-ui":{"prepare":"${{ steps.ui_prepare.outcome }}","run":"${{ steps.ui_run.outcome }}","finish":"${{ steps.ui_finish.outcome }}"}}
          PARLOR_VERIFICATION_UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          PARLOR_VERIFICATION_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          PARLOR_VERIFICATION_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 -B -m scripts.ci.verification_hygiene cleanup
      - name: Retain cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-protection-native-negative-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-ios-cleanup.json
