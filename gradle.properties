# Parlor — Gradle properties

# JVM
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# P2pKit is a required production dependency resolved only from Maven Central.
# Never add mavenLocal() or source auto-detection: dependency provenance must
# not depend on developer-home state.
