name: Production verification

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-android:
    name: Common, desktop, and Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run host-independent production gates
        run: ./gradlew productionCheck --no-daemon --stacktrace --console=plain

      - name: Upload verification reports and unsigned AAB
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-android-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            composeApp/build/outputs/bundle/release/*.aab

  ios:
    name: iOS release frameworks
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false

      - name: Record Xcode toolchain
        run: xcodebuild -version

      - name: Link iOS release frameworks
        run: ./gradlew productionAppleCheck --no-daemon --stacktrace --console=plain

      - name: Upload Kotlin/Native diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/
