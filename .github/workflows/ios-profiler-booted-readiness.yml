name: Owned boot-ready profiler condition (not app qualification)

on:
  push:
    branches: [diagnostic/ios-profiler-booted-readiness-2026-11-02]

permissions:
  contents: read

jobs:
  tool:
    name: Owned boot-ready Simulator then unchanged host profiler
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out exact boot-ready control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact owned lifecycle and unchanged profiler safeguards
        shell: bash
        run: |
          /usr/bin/python3 -B scripts/release/workflow_contract.py
          /usr/bin/python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p test_profiler_booted_readiness.py -v
          /usr/bin/python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p test_profiler_attach_control.py -v
      - name: Execute one boot-ready condition then original bounded profiler once
        shell: bash
        run: |
          /usr/bin/python3 -B scripts/verification/ios-input-boundaries/profiler_booted_readiness.py \
            "$RUNNER_TEMP/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve exact owned lifecycle and plain profiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profiler-booted-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}/profiler/receipt.json
            ${{ runner.temp }}/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}/profiler/*.log
            ${{ runner.temp }}/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}/profiler/toc.xml
            ${{ runner.temp }}/parlor-profiler-booted-${{ github.run_id }}-${{ github.run_attempt }}/profiler/samples.xml
