name: Retained input baseline (not production qualification)

on:
  push:
    branches: [verification/public-input-regression-2026-11-05]

permissions:
  contents: read

concurrency:
  group: retained-input-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unfinished-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - name: Check out frozen original application plus regression fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ee080766376b26f76d8f927b9d21553f90db7098
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false

      - name: Restore reviewed Gradle dependencies only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Bind the original application and unfinished regression scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ee080766376b26f76d8f927b9d21553f90db7098
          git diff --exit-code 40b02d74ce8e1529120e2a9bf7ee160ccb09e2c2 HEAD -- \
            composeApp/src/commonMain shared game-modes iosApp .github gradle gradle.properties
          python3 -B scripts/generate_review_inventory.py --check
          command -v xvfb-run
          mkdir -p build/ci-evidence
          python3 -B - <<'PY'
          import hashlib, json, pathlib, subprocess
          test = pathlib.Path('composeApp/src/desktopTest/kotlin/com/parlor/app/shell/game/multiplayer/RetainedNameConfirmationIdentityTest.kt')
          result = {
              'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'regression_sha256': hashlib.sha256(test.read_bytes()).hexdigest(),
              'scope': 'Three previously unexecuted host assertions; fixture now supplies app toast context',
              'production_qualification': False,
          }
          pathlib.Path('build/ci-evidence/source.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Execute only unfinished baseline methods without masking failures
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./gradlew :composeApp:desktopTest \
            --tests '*RetainedNameConfirmationIdentityTest.*host_identity*' \
            --dependency-verification=strict --no-daemon --no-parallel --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process --console=plain

      - name: Retain exact baseline result and source binding
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-input-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/source.json
            composeApp/build/test-results/desktopTest/TEST-*RetainedNameConfirmationIdentityTest.xml
          if-no-files-found: error
          retention-days: 14
