// Explicit opt-in test helper injection; no shipping source/workflow/ignored-fixture selection change.
gradle.projectsEvaluated {
    def project = gradle.rootProject.findProject(':shared:transport-p2p')
    if (project == null) return
    def helper = System.getProperty('parlor.processHelper')
    if (helper == null) throw new GradleException('Explicit test helper required')
    project.tasks.named('compileTestKotlinDesktop').configure { source(new File(helper)) }
    def desktopTest = project.tasks.named('desktopTest').get()
    project.tasks.register('realKitProcessClasspath') {
        dependsOn desktopTest.classpath
        dependsOn desktopTest.testClassesDirs
        doLast {
            def output = System.getProperty('parlor.processClasspath')
            if (output == null) throw new GradleException('Explicit test classpath output required')
            new File(output).text = desktopTest.classpath.asPath
        }
    }
}
