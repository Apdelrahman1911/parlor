name: SwiftBuild worker inventory (not production qualification)

on:
  push:
    branches: [diagnostic/swiftbuild-worker-inventory-2026-11-05]

permissions:
  contents: read

concurrency:
  group: swiftbuild-worker-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Read exact SwiftBuild component (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact isolated inventory source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Validate only the new inventory controls
        run: /usr/bin/python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p test_swiftbuild_worker_inventory.py -v
      - name: Inspect installed component without build, input, or signals
        run: |
          /usr/bin/python3 -B scripts/verification/ios-input-boundaries/swiftbuild_worker_inventory.py \
            --output "$RUNNER_TEMP/parlor-swiftbuild-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Retain bounded component identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftbuild-worker-inventory-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/parlor-swiftbuild-${{ github.run_id }}-${{ github.run_attempt }}/swiftbuild-worker-inventory.json
