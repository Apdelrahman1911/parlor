# Parlor — Gradle properties

# JVM
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# P2pKit 0.7.0-rc3 is built with Kotlin 2.4 metadata. Keep the independently
# replaceable Android analyzers on versions that understand that metadata while
# the application remains on the reviewed AGP 8.13.2/KMP integration.
android.experimental.lint.version=9.1.1
parlor.android.r8.version=9.1.41

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# P2pKit is a required production dependency resolved only from Maven Central.
# Never add mavenLocal() or source auto-detection: dependency provenance must
# not depend on developer-home state.
