# Parlor — Gradle properties

# JVM
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# P2pKit integration — set to true after cloning P2pKit as a sibling
# directory at ../P2pKit. When false, :shared:transport-p2p compiles its
# protocol-only surface and the in-memory transport stays the default.
parlor.p2p.enabled=false
