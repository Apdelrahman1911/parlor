name: Android relaunch language boundary (not qualification)
on:
  push:
    branches: [verification/android-relaunch-boundary-2026-11-06]
permissions:
  contents: read
concurrency:
  group: android-relaunch-boundary-${{ github.ref }}
  cancel-in-progress: false
env:
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
jobs:
  android-home-preview:
    name: Single failed Arabic relaunch boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out reviewed preview harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the exact reviewed acceptance candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git checkout --detach 3318a36e211b26291e4e17ff7dc6ae755027f359
          test -z "$(git status --porcelain)"
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Restore reviewed dependencies only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Claim fresh verification output ownership
        id: verification_ownership
        run: python3 -B scripts/ci/verification_hygiene.py prepare
      - name: Install pinned API34 and compilation packages
        timeout-minutes: 11
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          image=$(jq -r '.toolchains.android_navigation_device.system_image_package' config/release-policy.json)
          test "$image" = 'system-images;android-34;google_apis;x86_64'
          timeout --signal=TERM --kill-after=10s 600s \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "$image"
          image_properties="$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties"
          test -s "$image_properties"
          image_revision=$(sed -n 's/^Pkg.Revision=//p' "$image_properties" | tr -d '\r')
          test "$image_revision" = "$(jq -r '.toolchains.android_navigation_device.system_image_revision' config/release-policy.json)"
      - name: Verify source inventory and unchanged instructions
        run: |
          set -euo pipefail
          python3 -B scripts/generate_review_inventory.py --check
          echo 'd9505fa9e8338a8a1ca85a63e87ffc72a4a0013468116f6f6d7a5c4c7dfbc02b  AGENTS.md' | sha256sum --check
      - name: Observe one failed relaunch boundary once
        run: |
          set -euo pipefail
          python3 -B scripts/android/supervise_managed_device.py \
            --receipt build/ci-evidence/android-navigation-device-supervision.json --isolated-avd -- \
            ./gradlew :composeApp:detekt productionAndroidNavigationRuntimeCheck \
            -Pparlor.androidRuntimeTestVariant=debug \
            -Pandroid.testInstrumentationRunnerArguments.class=com.parlor.app.storage.AndroidResumeUiRuntimeTest#testArabicCancelAndDiscardThroughNativeHomeSurviveActivityRelaunch \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --dependency-verification=strict --no-daemon --max-workers=2 --info --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/parlor-android-recovery-preview.log"
      - name: Bind source and actual native outcomes
        if: always()
        run: |
          python3 -B - <<'PYCODE'
          import hashlib,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head=='3318a36e211b26291e4e17ff7dc6ae755027f359' and not subprocess.check_output(['git','status','--porcelain'])
          sources=sorted((root/'composeApp/src/androidNavigationRuntimeTest/kotlin').rglob('*.kt'))
          expected=[]
          for source in sources:
              raw=source.read_text()
              package=re.search(r'^package ([\w.]+)',raw,re.M).group(1)
              classname=re.search(r'^class (\w+) : InstrumentationTestCase\(\)',raw,re.M)
              if classname:
                  expected += [(package+'.'+classname.group(1),method) for method in re.findall(r'fun (test\w+)\(',raw)]
          reports=list((root/'composeApp/build/outputs/androidTest-results/managedDevice/debug/pixel2Api34').glob('TEST-*.xml'))
          assert len(reports)==1 and len(expected)==23
          expected=[('com.parlor.app.storage.AndroidResumeUiRuntimeTest','testArabicCancelAndDiscardThroughNativeHomeSurviveActivityRelaunch')]
          xml=ET.parse(reports[0]);methods=[(t.get('classname'),t.get('name')) for t in xml.iter('testcase')]
          assert not list(xml.iter('error')) and not list(xml.iter('skipped'))
          failures=[e.text for e in xml.iter('failure')]
          assert len(failures)<=1
          assert sorted(methods)==sorted(expected)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          record=dict(scope='One Arabic relaunch observation; failures remain failures, not qualification',source=head,
              tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),methods=sorted(methods),
              outcome='FAIL' if failures else 'PASS_SCOPED_ONLY',failures=failures,
              source_files={str(p.relative_to(root)):sha(p) for p in sources},xml_sha256=sha(reports[0]))
          output=root/'build/ci-evidence/android-recovery-preview.json'
          with output.open('x') as stream:json.dump(record,stream,indent=2)
          print('Actual native API34 methods:',len(methods))
          PYCODE
      - name: Stop owned Gradle workers
        if: always()
        run: python3 -B scripts/ci/verification_hygiene.py stop android-home-preview
      - name: Upload source-bound native evidence
        if: always()
        id: verification_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-recovery-preview
          retention-days: 14
          if-no-files-found: warn
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
            **/build/reports/detekt/
            build/ci-evidence/
            ${{ runner.temp }}/parlor-android-recovery-preview.log
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-ownership.json
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-stop-*.json
            !remediation-runs/**
            !docs/archives/**
      - name: Clean only attested and uploaded outputs
        if: always()
        env:
          PARLOR_VERIFICATION_PREPARE_OUTCOME: ${{ steps.verification_ownership.outcome }}
          PARLOR_VERIFICATION_UPLOAD_OUTCOME: ${{ steps.verification_artifact.outcome }}
          PARLOR_VERIFICATION_ARTIFACT_ID: ${{ steps.verification_artifact.outputs.artifact-id }}
          PARLOR_VERIFICATION_ARTIFACT_DIGEST: ${{ steps.verification_artifact.outputs.artifact-digest }}
        run: python3 -B scripts/ci/verification_hygiene.py cleanup
      - name: Retain output cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-recovery-preview-cleanup
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-cleanup.json
