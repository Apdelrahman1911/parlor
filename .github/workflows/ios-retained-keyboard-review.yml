name: Retained iOS keyboard boundary review (not qualification)

on:
  push:
    branches: [diagnostic/ios-retained-keyboard-boundary-2026-11-03]

concurrency:
  group: retained-ios-keyboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    # Standard free public runner; no app build, Simulator, signing or cache writes.
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact reviewed reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source-bound intake and public-only reduction
        shell: bash
        run: |
          /usr/bin/python3 -B scripts/release/workflow_contract.py
          /usr/bin/python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p test_retained_keyboard_review.py -v
      - name: Decode original archives without replaying input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -B scripts/verification/ios-input-boundaries/review_retained_keyboard.py \
            --output "$RUNNER_TEMP/parlor-retained-keyboard-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain closed numeric facts only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-keyboard-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/parlor-retained-keyboard-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
