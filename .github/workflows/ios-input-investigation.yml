name: Android API34 startup follow-up (not production qualification)

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact failed main source; this follow-up cannot select a different application
        required: true
        type: string
        default: 621d3ce303a048d1ec30e9550f7cceab8dc063bd

permissions:
  contents: read

concurrency:
  group: parlor-api34-startup-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
  PARLOR_ORIGINAL_SOURCE: ${{ inputs.source }}

jobs:
  desktop-android:
    if: github.ref == 'refs/heads/diagnostic/android-api34-startup-2026-11-04' && inputs.source == '621d3ce303a048d1ec30e9550f7cceab8dc063bd'
    name: API34 setup only, exact failed main, no APK/test replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the original application, not the diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
      - name: Admit exact source and retain initial capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$PARLOR_ORIGINAL_SOURCE" = 621d3ce303a048d1ec30e9550f7cceab8dc063bd
          test "$(git rev-parse HEAD)" = "$PARLOR_ORIGINAL_SOURCE"
          test -z "$(git status --porcelain)"
          test "$(sha256sum AGENTS.md | cut -d' ' -f1)" = d9505fa9e8338a8a1ca85a63e87ffc72a4a0013468116f6f6d7a5c4c7dfbc02b
          mkdir -p build/ci-evidence/api34-startup
          printf 'application=%s\nharness=%s\nrun=%s\nattempt=%s\n' "$PARLOR_ORIGINAL_SOURCE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build/ci-evidence/api34-startup/source.txt
          python3 -B scripts/ci/hosted_linux_capacity.py
      - name: Restore reviewed dependencies, never save diagnostic state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install the same reviewed API34 image and current hosted emulator
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          image=$(jq -r '.toolchains.android_navigation_device.system_image_package' config/release-policy.json)
          test "$image" = 'system-images;android-34;google_apis;x86_64'
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' "$image" \
            2>&1 | tee build/ci-evidence/api34-startup/sdk-install.log
          revision=$(sed -n 's/^Pkg.Revision=//p' "${ANDROID_HOME}/system-images/android-34/google_apis/x86_64/source.properties" | tr -d '\r')
          test "$revision" = "$(jq -r '.toolchains.android_navigation_device.system_image_revision' config/release-policy.json)"
      - name: Record actual tools and resources before setup
        shell: bash
        run: |
          set -euo pipefail
          {
            date -u
            uname -a
            java -version
            "${ANDROID_HOME}/emulator/emulator" -version
            "${ANDROID_HOME}/emulator/emulator" -help-gpu
            cat "${ANDROID_HOME}/emulator/source.properties"
            cat "${ANDROID_HOME}/system-images/android-34/google_apis/x86_64/source.properties"
            df -B1 "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            free -b
          } 2>&1 | tee build/ci-evidence/api34-startup/toolchain-and-resources.log
      - name: One supervised setup with original GPU argument and visible emulator logs
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/android/supervise_managed_device.py \
            --receipt build/ci-evidence/api34-startup/supervision.json \
            -- ./gradlew :composeApp:pixel2Api34Setup \
            -Pparlor.androidRuntimeTestVariant=debug \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --dependency-verification=strict --no-daemon --max-workers=2 \
            --info --stacktrace --console=plain \
            2>&1 | tee build/ci-evidence/api34-startup/setup.log
      - name: Preserve bounded configuration metadata and stop Gradle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --stop
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root = Path('build/ci-evidence/api34-startup')
          root.mkdir(parents=True, exist_ok=True)
          rows = []
          # Do not export userdata, snapshots, credentials, or arbitrary emulator files.
          for parent in [Path.home()/'.android/avd', Path.home()/'.android/avd/gradle-managed']:
              for name in ['dev34_google_apis_x86_64_Pixel_2.ini', 'dev34_google_apis_x86_64_Pixel_2.avd/config.ini']:
                  p = parent/name
                  if p.is_file() and not p.is_symlink() and p.stat().st_size <= 1024*1024:
                      data = p.read_bytes()
                      rows.append(dict(parent=parent.name, name=name, sha256=hashlib.sha256(data).hexdigest(), configuration=data.decode()))
          usage = shutil.disk_usage(Path.home())
          (root/'final-metadata.json').write_text(json.dumps(dict(result='SETUP_OBSERVATION_NOT_MAIN_OR_RUNTIME_QUALIFICATION', config=rows, disk=dict(total=usage.total,used=usage.used,free=usage.free)),indent=2)+'\n')
          PY
          test "$(git rev-parse HEAD)" = "$PARLOR_ORIGINAL_SOURCE"
          test -z "$(git status --porcelain)"
      - name: Retain setup failures, actual source and resource evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-api34-startup-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ci-evidence/api34-startup
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-desktop-android-hosted-disk.json
