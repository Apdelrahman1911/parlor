name: Word Impostor large-text journeys (not full qualification)
on:
  push:
    branches: [verification/ux-acceptance-preview-2026-11-06]
permissions:
  contents: read
concurrency:
  group: ux-acceptance-preview-${{ github.ref }}
  cancel-in-progress: false
env:
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
jobs:
  ux-preview:
    name: Verify Word Impostor complete large-text journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out reviewed experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the exact acceptance candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git checkout --detach cd0debdd7f57568fa390e5b4a9abeaee435b1edd
          test -z "$(git status --porcelain)"
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Restore reviewed dependencies only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Claim fresh verification output ownership
        id: verification_ownership
        run: python3 -B scripts/ci/verification_hygiene.py prepare
      - name: Install the compile-only Android SDK inputs
        timeout-minutes: 6
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run changed module rules, private-state and rendered UI regressions
        run: |
          set -euo pipefail
          ./gradlew :game-modes:word-impostor:desktopTest :game-modes:word-impostor:detekt \
            --dependency-verification=strict \
            --no-daemon --max-workers=2 --console=plain \
            2>&1 | tee "$RUNNER_TEMP/parlor-ux-build.log"
      - name: Bind source, exact tests and synthetic renders
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head=='cd0debdd7f57568fa390e5b4a9abeaee435b1edd' and not subprocess.check_output(['git','status','--porcelain'])
          expected=[['com.parlor.games.wordimpostor.WordImpostorDisplayScalarBoundaryTest', 'authorityPersistenceRejectsFormatControlsInsteadOfChangingIdentity()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorDisplayScalarBoundaryTest', 'identifierValidationRejectsUnsafeScalarsWithoutRewritingValidIds()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorDisplayScalarBoundaryTest', 'initialStateRejectsSupplementaryFormatControls()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorDisplayScalarBoundaryTest', 'publicSnapshotRejectsFormatControlsInsteadOfSilentlyRepairingTheName()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorDisplayScalarBoundaryTest', 'supplementaryFormatControlsAreRejectedByNamesAndRosters()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorDisplayScalarBoundaryTest', 'supplementaryLettersEmojiAndVariationMarksRemainCanonical()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorIntegrityTest', 'abort_cannot_be_used_to_smuggle_impossible_vote_totals_or_progress()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorIntegrityTest', 'bounded_history_aborts_without_revealing_the_word_votes_or_roles_and_still_restores()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorIntegrityTest', 'deeply_nested_input_is_rejected_before_recursive_decoding()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorIntegrityTest', 'private_guess_cannot_arrive_before_its_public_submission_count()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorRecoveryJourneyTest', 'forty_two_complete_matches_preserve_private_ballots_guesses_scores_and_identity()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorRulesTest', 'completeBanksHaveUniqueWordsQuestionsAndPlausibleChoices()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorRulesTest', 'disconnectedOrForgedActionsCannotAdvanceOrExposeASecret()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorRulesTest', 'everyPlayerAndImpostorCountCompletesAllPhasesPrivately()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorRulesTest', 'tiesFailIdentificationAndScoresFollowBothIndependentObjectives()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorScoringTest', 'each_correct_voter_and_each_correct_guesser_get_independent_points_for_every_supported_size()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorScoringTest', 'multiple_rounds_accumulate_only_personal_points_and_snapshots_validate_own_ballot()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorScoringTest', 'tied_tallies_do_not_cancel_a_correct_individual_vote_or_successful_word_guess()[desktop]', False], ['com.parlor.games.wordimpostor.WordImpostorVersionTest', 'legacy_and_future_actions_projections_and_authority_snapshots_fail_closed()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordFrameRestorationTest', 'restoration_after_authority_advanced_does_not_apply_an_old_phases_scroll()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordFrameRestorationTest', 'same_phase_recreation_restores_scroll_but_new_phase_starts_at_the_header()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'arabic_dark_compact_large_text_journey()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'arabic_light_compact_large_text_journey()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'english_dark_compact_large_text_journey()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'english_light_compact_large_text_journey()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'guided_question_is_private_to_asker_and_advances_with_its_exact_index()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'hiding_a_revealed_secret_does_not_submit_readiness_or_wait_for_network()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'light_theme_rules_start_with_a_compact_guide_and_expand_details_on_request()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'ordinary_and_impostor_secrets_are_covered_on_entry_and_interruption_in_both_languages()[desktop]', False], ['com.parlor.games.wordimpostor.ui.WordImpostorTableTest', 'private_vote_confirmation_then_five_choice_guess_and_public_result_work_end_to_end()[desktop]', False]]
          reports=sorted((root/'game-modes/word-impostor/build/test-results/desktopTest').glob('TEST-*.xml'))
          actual=[]
          for report in reports:
              xml=ET.parse(report)
              assert not list(xml.iter('failure')) and not list(xml.iter('error')) and not list(xml.iter('skipped'))
              actual += [[t.get('classname'),t.get('name'),False] for t in xml.iter('testcase')]
          assert sorted(actual)==sorted(expected)
          expected_images=['game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-guessing-covered-ar-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-guessing-covered-ar-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-guessing-covered-ar-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-guessing-covered-en-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-guessing-covered-en-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-guessing-covered-en-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-next-question-public-ar-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-next-question-public-ar-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-next-question-public-ar-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-next-question-public-en-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-next-question-public-en-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-next-question-public-en-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-rematch-covered-ar-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-rematch-covered-ar-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-rematch-covered-ar-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-rematch-covered-en-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-rematch-covered-en-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-rematch-covered-en-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-results-ar-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-results-ar-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-results-ar-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-results-en-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-results-en-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-results-en-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-voting-ar-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-voting-ar-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-voting-ar-system-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-voting-en-dark-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-voting-en-light-2.0.png', 'game-modes/word-impostor/build/reports/tests/public-ux/word-impostor-voting-en-system-2.0.png']
          images=sorted((root/'game-modes/word-impostor/build/reports/tests/public-ux').glob('*.png'))
          assert sorted(str(p.relative_to(root)) for p in images)==sorted(expected_images)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          record=dict(scope='Word Impostor Desktop rules/private-state and rendered journeys only; not native/full PR/main qualification',
              source=head,tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),methods=sorted(actual),
              xml={str(p.relative_to(root)):sha(p) for p in reports},
              renders=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=sha(p)) for p in images])
          output=root/'build/ci-evidence/public-ux-preview.json';output.parent.mkdir(parents=True,exist_ok=True)
          with output.open('x') as stream:json.dump(record,stream,indent=2)
          print('Actual Word Impostor methods:',len(actual),'; retained synthetic PNGs:',len(images))
          PY
      - name: Stop owned Gradle workers
        if: always()
        run: python3 -B scripts/ci/verification_hygiene.py stop ux-preview
      - name: Upload only current fixture and test evidence
        if: always()
        id: verification_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-ux-acceptance-preview
          retention-days: 14
          if-no-files-found: warn
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            **/build/reports/detekt/
            build/ci-evidence/public-ux-preview.json
            ${{ runner.temp }}/parlor-ux-build.log
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-ownership.json
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-stop-*.json
            !remediation-runs/**
            !docs/archives/**
      - name: Clean only attested and uploaded outputs
        if: always()
        env:
          PARLOR_VERIFICATION_PREPARE_OUTCOME: ${{ steps.verification_ownership.outcome }}
          PARLOR_VERIFICATION_UPLOAD_OUTCOME: ${{ steps.verification_artifact.outcome }}
          PARLOR_VERIFICATION_ARTIFACT_ID: ${{ steps.verification_artifact.outputs.artifact-id }}
          PARLOR_VERIFICATION_ARTIFACT_DIGEST: ${{ steps.verification_artifact.outputs.artifact-digest }}
        run: python3 -B scripts/ci/verification_hygiene.py cleanup
      - name: Retain output cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-ux-preview-cleanup
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-cleanup.json
