name: Native main-runloop capability (not iOS qualification)

on:
  push:
    branches: [diagnostic/ios-main-runloop-boundary-2026-11-01]

concurrency:
  group: main-runloop-capability-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    name: Actual Apple event-driven runloop software control
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PARLOR_INPUT_OUTPUT: parlor-pin46-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact reviewed native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Verify exact workflow then execute new source-specific native controls once
        shell: bash
        run: |
          /usr/bin/python3 -B scripts/release/workflow_contract.py
          export PARLOR_RUNLOOP_CONTROL_OUTPUT="$RUNNER_TEMP/$PARLOR_INPUT_OUTPUT"
          /usr/bin/python3 -B -m unittest discover \
            -s scripts/verification/ios-input-boundaries -p test_pin46_main_runloop.py -v
      - name: Retain native software capability or original failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-runloop-capability-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/state.json
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/main.swift
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/compiler.log
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/control.stdout
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/control.stderr
