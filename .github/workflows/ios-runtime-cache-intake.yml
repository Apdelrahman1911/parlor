name: iOS runtime cache intake (read-only, not qualification)

on:
  push:
    branches: [diagnostic/ios-runtime-cache-intake-2026-11-04]

permissions:
  contents: read

concurrency:
  group: parlor-ios-runtime-cache-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: macos-15
    timeout-minutes: 6
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PARLOR_CACHE_INTAKE_NAME: parlor-cache-intake-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Portable read-only selector and ownership controls
        run: /usr/bin/python3 -B -m unittest discover -s scripts/verification/ios-runtime-cache-intake -v
      - name: Read actual pinned-Xcode usage and installed runtime caches
        env:
          PARLOR_CACHE_INTAKE_OUTPUT: ${{ runner.temp }}/${{ env.PARLOR_CACHE_INTAKE_NAME }}
        run: /usr/bin/python3 -B scripts/verification/ios-runtime-cache-intake/intake.py
      - name: Preserve read-only native outcomes without app or cache mutation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-runtime-cache-intake-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/${{ env.PARLOR_CACHE_INTAKE_NAME }}
