name: Production verification

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-android:
    name: Common, desktop, and Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Record exact source and require a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          git rev-parse HEAD | tee build/ci-evidence/commit.txt
          test -z "$(git status --porcelain)"

      - name: Run common, desktop, Android, static-analysis, and release gates
        run: ./gradlew productionCheck productionStaticAnalysis allTests --dependency-verification=strict --no-daemon --stacktrace --console=plain

      - name: Inspect unsigned Android release artifact and merged manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find composeApp/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print)
          test "${#aabs[@]}" -eq 1
          aab="${aabs[0]}"
          unzip -t "$aab"
          unzip -l "$aab" | grep -Fq 'base/manifest/AndroidManifest.xml'
          unzip -l "$aab" | grep -Fq 'base/dex/classes.dex'
          manifest="$(find composeApp/build/intermediates -type f -path '*merged_manifest*/*/AndroidManifest.xml' -print -quit)"
          test -s "$manifest"
          grep -Fq '<manifest' "$manifest"
          grep -Fq 'android.permission.INTERNET' "$manifest"
          sha256sum "$aab" | tee build/ci-evidence/android-aab.sha256
          cp "$manifest" build/ci-evidence/merged-release-manifest.xml

      - name: Upload verification reports, mappings, and unsigned AAB
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-android-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci-evidence/
            **/build/reports/detekt/
            **/build/reports/tests/
            **/build/reports/lint-results-*
            composeApp/build/outputs/mapping/release/
            composeApp/build/outputs/bundle/release/*.aab

  ios:
    name: iOS tests, release frameworks, and Swift wrapper
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # macos-15 installs this reviewed GA toolchain alongside newer Xcodes.
      # Fail explicitly if the runner image removes or replaces it instead of
      # silently qualifying a candidate with a different compiler/SDK.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false

      - name: Record Xcode toolchain and exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version | tee build/ci-evidence/xcode-version.txt
          test "$(sed -n '1p' build/ci-evidence/xcode-version.txt)" = "Xcode 16.4"
          test "$(sed -n '2p' build/ci-evidence/xcode-version.txt)" = "Build version 16F6"
          xcrun --sdk iphoneos --show-sdk-version | tee build/ci-evidence/iphoneos-sdk.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee build/ci-evidence/iphonesimulator-sdk.txt
          git rev-parse HEAD | tee build/ci-evidence/commit.txt
          test -z "$(git status --porcelain)"

      - name: Run iOS simulator runtime tests and release linkage-only gates
        shell: bash
        run: |
          set -euo pipefail
          echo "allTests includes executable simulator runtime tests; productionAppleCheck is linkage-only for iosArm64, iosSimulatorArm64, and iosX64."
          ./gradlew allTests productionAppleCheck --dependency-verification=strict --no-daemon --stacktrace --console=plain

      - name: Validate iOS plist and privacy manifest
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint iosApp/iosApp/Info.plist
          plutil -lint iosApp/iosApp/PrivacyInfo.xcprivacy

      - name: Build unsigned Swift Release wrapper
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/xcode-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/ci-evidence/xcode-release-build.log
          app="build/xcode-derived-data/Build/Products/Release-iphonesimulator/Parlor.app"
          test -x "$app/Parlor"
          plutil -lint "$app/Info.plist"
          file "$app/Parlor" | tee build/ci-evidence/xcode-binary.txt
          shasum -a 256 "$app/Parlor" | tee build/ci-evidence/xcode-binary.sha256

      - name: Upload Apple verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci-evidence/
            build/xcode-derived-data/Build/Products/Release-iphonesimulator/Parlor.app.dSYM/
            **/build/reports/detekt/
            **/build/reports/tests/
