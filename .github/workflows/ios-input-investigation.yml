name: Corrected iOS26 keyboard journeys (not protected qualification)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parlor-ios26-keyboard-correction-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  ios:
    name: Corrected EN/AR keyboard geometry on iOS 26.2
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out frozen current UI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a5f0f0278f2be6381bd74f7304d1fd9dda0b3e0f
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Restore reviewed dependencies without saving diagnostic state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Claim fresh output ownership
        id: ownership
        run: python3 -B -m scripts.ci.verification_hygiene prepare
      - name: Record exact source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a5f0f0278f2be6381bd74f7304d1fd9dda0b3e0f
          test -z "$(git status --porcelain)"
          mkdir -p build/ci-evidence
          git rev-parse HEAD HEAD^{tree} | tee build/ci-evidence/source.txt
          git ls-tree -r HEAD > build/ci-evidence/source-tree.txt
          xcodebuild -version | tee build/ci-evidence/xcode-version.txt
          test "$(sed -n '1p' build/ci-evidence/xcode-version.txt)" = 'Xcode 26.3'
          test "$(sed -n '2p' build/ci-evidence/xcode-version.txt)" = 'Build version 17C529'
          xcrun --sdk iphonesimulator --show-sdk-version > build/ci-evidence/sdk-version.txt
          shasum -a 256 AGENTS.md > build/ci-evidence/agents.sha256
          test "$(cut -d' ' -f1 build/ci-evidence/agents.sha256)" = d9505fa9e8338a8a1ca85a63e87ffc72a4a0013468116f6f6d7a5c4c7dfbc02b
      - name: Claim isolated native test cycle
        id: ui_prepare
        run: python3 -B -m scripts.ci.apple_verification_hygiene prepare apple-ui
      - name: Create the owned required Simulator before expensive compilation
        id: create_sim
        shell: bash
        run: |
          set -euo pipefail
          # Reorder real inventory only; no fake values or omitted baseline devices.
          simulator_udid="$(python3 -B - <<'PYCREATE'
          from scripts.ci import apple_verification_hygiene as apple, verification_hygiene as common, owned_ci_simulator as sim
          class ExplicitRuntimeBackend(sim.SimctlBackend):
              def inventory(self):
                  value = super().inventory()
                  runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
                  kind = 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro'
                  groups = value['devices']
                  selected = groups.get(runtime, [])
                  matches = [d for d in selected if d.get('isAvailable') is True and d.get('deviceTypeIdentifier') == kind]
                  assert matches, 'Required iOS26.2 /iPhone17Pro unavailable; no fallback'
                  ordered = sorted(selected, key=lambda d: not (d.get('isAvailable') is True and d.get('deviceTypeIdentifier') == kind))
                  return {**value, 'devices': {runtime: ordered, **{k:v for k,v in groups.items() if k != runtime}}}
          root, prefix, task = common.context()
          owned = apple.cycle_prefix(prefix, 'apple-ui')
          claim = apple.validate_claim(root, owned, task, 'apple-ui', apple.configuration(root))
          udid = sim.create(owned, claim, ExplicitRuntimeBackend())
          plan = sim.read_record(sim.paths(owned)[0])
          assert (plan['runtime'],plan['device_type']) == ('com.apple.CoreSimulator.SimRuntime.iOS-26-2','com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro')
          print(udid)
          PYCREATE
          )"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"
      - name: Claim owned native compilation cycle
        id: aggregate_prepare
        run: python3 -B -m scripts.ci.apple_verification_hygiene prepare apple-aggregate
      - name: Link current Debug app framework
        id: aggregate_run
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            --dependency-verification=strict --no-daemon --max-workers=2 \
            --stacktrace --console=plain | tee build/ci-evidence/native-link.log
      - name: Stop compilation workers
        id: aggregate_finish
        if: always()
        env:
          PARLOR_APPLE_PREPARE_OUTCOME: ${{ steps.aggregate_prepare.outcome }}
          PARLOR_APPLE_RUN_OUTCOME: ${{ steps.aggregate_run.outcome }}
        run: python3 -B -m scripts.ci.apple_verification_hygiene finish apple-aggregate
      - name: Execute affected original journeys and eleven native regressions
        id: ui_run
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="${{ steps.create_sim.outputs.udid }}"
          test -n "$simulator_udid"
          test ! -e build/ci-evidence/ios-ui-tests.xcresult
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -destination-timeout 120 -derivedDataPath build/xcode-derived-data \
            -resultBundlePath build/ci-evidence/ios-ui-tests.xcresult \
            -only-testing:iosAppUITests/IOSAppLaunchUITests/testKeyboardInsetsOnNameAndRoomCodeInArabic \
            -only-testing:iosAppUITests/IOSAppLaunchUITests/testKeyboardInsetsOnNameAndRoomCodeInEnglish \
            -only-testing:iosAppUITests/IOSAppLaunchUITests/testArabicDisplayNameAndAsciiRoomCodeThroughNativeInput \
            -only-testing:iosAppUITests/IOSAppLaunchUITests/testLastLightLocalPlayerFieldsScrollWithNextAndDismissWithDone \
            -only-testing:iosAppUITests/PublicKeyboardGeometryTests \
            -only-testing:iosAppUITests/PublicKeyboardSurfaceTests \
            test | tee build/ci-evidence/xcode-ui-test.log
          python3 - <<'PYOUT'
          from pathlib import Path
          import re,json
          expected = ['IOSAppLaunchUITests/testKeyboardInsetsOnNameAndRoomCodeInArabic()', 'IOSAppLaunchUITests/testKeyboardInsetsOnNameAndRoomCodeInEnglish()', 'IOSAppLaunchUITests/testArabicDisplayNameAndAsciiRoomCodeThroughNativeInput()', 'IOSAppLaunchUITests/testLastLightLocalPlayerFieldsScrollWithNextAndDismissWithDone()', 'PublicKeyboardGeometryTests/testHittabilityIsQueriedOnlyAfterTwoExactValidSamples()', 'PublicKeyboardGeometryTests/testInfiniteEmptyAndNegativeFramesNeverRequestAHitPoint()', 'PublicKeyboardGeometryTests/testMissingOrInvalidSampleBreaksAdjacency()', 'PublicKeyboardGeometryTests/testThirtyThreePointAndKeyboardSizedGapsRemainFailures()', 'PublicKeyboardGeometryTests/testFieldOutsideTheVisibleAreaOrBelowTheActionCannotSettle()', 'PublicKeyboardGeometryTests/testSubpointFieldActionAndKeyboardMotionDoesNotSettle()', 'PublicKeyboardGeometryTests/testNonhittableFieldRequiresTwoFreshSamples()', 'PublicKeyboardSurfaceTests/testActualIos26AsciiBackgroundIsIncludedWithoutAnOffset()', 'PublicKeyboardSurfaceTests/testPredictionRowAndBackgroundUseTheFullVisibleSurface()', 'PublicKeyboardSurfaceTests/testWholeWindowAndUnrelatedRowsCannotHideExcessiveSpacing()', 'PublicKeyboardSurfaceTests/testInvalidFramesDoNotManufactureAKeyboardBoundary()']
          log=Path('build/ci-evidence/xcode-ui-test.log').read_text()
          starts=re.findall(r"Test Case '-\[iosAppUITests\.(\w+) (test\w+)\]' started\.",log)
          passes=re.findall(r"Test Case '-\[iosAppUITests\.(\w+) (test\w+)\]' passed \(([\d.]+) seconds\)\.",log)
          assert len(starts)==len(passes)==len(set(starts))==len(expected)==15
          assert {c+'/'+m+'()' for c,m in starts}=={c+'/'+m+'()' for c,m,_ in passes}==set(expected)
          assert all(float(d)>0 for _,_,d in passes) and '** TEST SUCCEEDED **' in log
          Path('build/ci-evidence/focused-result.json').write_text(json.dumps(dict(result='PASS_ALL15_AFFECTED_IOS26_2_NOT_MAIN_OR_ORIGINAL_CAUSALITY',methods=expected,main_qualified=False,input_causality_resolved=False,physical_verified=False),indent=2))
          PYOUT
          app=build/xcode-derived-data/Build/Products/Debug-iphonesimulator/Parlor.app
          test -d "$app" && test ! -L "$app"
          ditto -c -k --keepParent "$app" build/ci-evidence/ios-ui-debug-app.zip
          shasum -a 256 build/ci-evidence/ios-ui-debug-app.zip > build/ci-evidence/ios-ui-debug-app.sha256
      - name: Retire owned UI workers and simulator
        id: ui_finish
        if: always()
        env:
          PARLOR_APPLE_PREPARE_OUTCOME: ${{ steps.ui_prepare.outcome }}
          PARLOR_APPLE_RUN_OUTCOME: ${{ steps.ui_run.outcome }}
        run: python3 -B -m scripts.ci.apple_verification_hygiene finish apple-ui
      - name: Retain actual source, executable, outcomes and custody
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios26-keyboard-correction-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/ci-evidence/
            ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-ios*.json
      - name: Clean only attested uploaded outputs
        id: cleanup
        if: always()
        env:
          PARLOR_VERIFICATION_PREPARE_OUTCOME: ${{ steps.ownership.outcome }}
          PARLOR_APPLE_CYCLE_OUTCOMES: >-
            {"apple-aggregate":{"prepare":"${{ steps.aggregate_prepare.outcome }}","run":"${{ steps.aggregate_run.outcome }}","finish":"${{ steps.aggregate_finish.outcome }}"},
             "apple-ui":{"prepare":"${{ steps.ui_prepare.outcome }}","run":"${{ steps.ui_run.outcome }}","finish":"${{ steps.ui_finish.outcome }}"}}
          PARLOR_VERIFICATION_UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          PARLOR_VERIFICATION_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          PARLOR_VERIFICATION_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 -B -m scripts.ci.verification_hygiene cleanup
      - name: Retain cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios26-keyboard-correction-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/parlor-verification-${{ github.run_id }}-${{ github.run_attempt }}-ios-cleanup.json
