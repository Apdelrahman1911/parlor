name: iOS retained public scroll validation (not qualification)

on:
  push:
    branches: [diagnostic/ios-public-scroll-order-correction-2026-11-01]

concurrency:
  group: public-scroll-order-correction-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retained:
    # Artifact-only readback on a standard free runner: no native build replay.
    name: Corrected retained diagnostic order
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PARLOR_ORDER_OUTPUT: parlor-pin37-correction-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out reviewed correction and original history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source privacy ownership and corrective reader controls
        shell: bash
        run: |
          python3 -B scripts/release/workflow_contract.py
          python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p 'test_pin37*.py' -v
          python3 -B -m unittest scripts.release.tests.test_workflow_contract scripts.release.tests.test_review_inventory -v
      - name: Revalidate exact retained native evidence without XCTest replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/verification/ios-input-boundaries/read_pin37_order_correction.py \
            --output "$RUNNER_TEMP/$PARLOR_ORDER_OUTPUT"
      - name: Retain corrected receipt and original custody even on rejection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-scroll-order-correction-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/corrected-public-scroll-validation.json
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/original-run-api.json
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/original-artifacts-api.json
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/original-job-api.json
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/original-job.log
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/corrective-readback/state.json
            ${{ runner.temp }}/${{ env.PARLOR_ORDER_OUTPUT }}/corrective-readback/corrected-diagnostic-observations.json
