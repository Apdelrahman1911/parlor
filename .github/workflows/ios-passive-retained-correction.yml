name: Retained passive iOS validation (not qualification)

on:
  push:
    branches: [diagnostic/ios-passive-retained-correction-2026-11-01]

concurrency:
  group: passive-retained-correction-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retained:
    # Artifact-only validation on one standard free runner; never replay native tests.
    name: Corrected retained passive sample ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PARLOR_RETAINED_OUTPUT: parlor-pin47-retained-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out reviewed correction and original history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual runner path and strict retained-reader controls
        shell: bash
        run: |
          python3 -B scripts/release/workflow_contract.py
          python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p test_pin47_retained_correction.py -v
          python3 -B -m unittest scripts.release.tests.test_passive_retained_workflow_contract scripts.release.tests.test_review_inventory -v
      - name: Validate exact retained native results without build or journey replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/verification/ios-input-boundaries/read_pin47_retained_correction.py \
            --output "$RUNNER_TEMP/$PARLOR_RETAINED_OUTPUT"
      - name: Preserve original incomplete state and separate corrective receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passive-retained-correction-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/corrected-pin47-validation.json
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/original-run-api.json
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/original-artifacts-api.json
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/original-job-api.json
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/original-job.log
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/original-artifact.zip
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/corrective-readback/state.json
            ${{ runner.temp }}/${{ env.PARLOR_RETAINED_OUTPUT }}/corrective-readback/corrected-diagnostic-observations.json
