# Parlor — Gradle properties

# JVM
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# P2pKit integration. The build auto-detects whether P2pKit 0.6.0 is
# published in your mavenLocal and enables multiplayer accordingly. So as
# long as you have ../P2pKit cloned and have run
#   ./gradlew :p2p-core:publishToMavenLocal :p2p-transport-lan:publishToMavenLocal
# once, every build (Android Studio, IntelliJ, CLI) turns multiplayer on
# automatically — no flag needed.
#
# Uncomment to force a specific behaviour:
#   parlor.p2p.enabled=true   # always on (build fails if P2pKit isn't in mavenLocal)
#   parlor.p2p.enabled=false  # always off (skip multiplayer even if P2pKit is present)
