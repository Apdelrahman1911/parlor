name: iOS owned text boundary (not qualification)

on:
  push:
    branches: [diagnostic/ios-owned-text-boundary-2026-11-02]

concurrency:
  group: owned-text-boundary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Isolated public-name native delivery and failed-export control
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PARLOR_INPUT_OUTPUT: parlor-pin51-text-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out reviewed harness and exact original history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Restore reviewed dependencies without saving diagnostic state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Execute actual ABI privacy and source controls once before app use
        shell: bash
        run: |
          /usr/bin/python3 -B scripts/release/workflow_contract.py
          /usr/bin/python3 -B -m unittest discover -s scripts/verification/ios-input-boundaries -p test_pin51_owned_text.py -v
      - name: Execute separately named public-name and failure-only exporter control once
        shell: bash
        run: |
          /usr/bin/python3 -B scripts/verification/ios-input-boundaries/run_pin51.py \
            --source 5029b3f48c2d012b34dd2748f809dc775276a622 \
            --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 \
            --device com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            --profile isolated-owned-native-text-export \
            --output "$RUNNER_TEMP/$PARLOR_INPUT_OUTPUT"
      - name: Retain real original assertions native numeric evidence and owned cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-text-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/state.json
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/owned-text-export.json
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/compose/*.json
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/compose/*.log
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/compose/tests.xcresult
            ${{ runner.temp }}/${{ env.PARLOR_INPUT_OUTPUT }}/compose/attachments
