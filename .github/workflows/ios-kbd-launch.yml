name: Held protection remaining iOS frontends (not native qualification)

on:
  push:
    branches: [verification/ios-protection-frontends-2026-11-05]

permissions:
  contents: read

concurrency:
  group: held-protection-frontends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontends:
    # Standard free public Linux runner; no Apple runtime, signing or release.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact held implementation, not diagnostic application code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2e7de440eeb867e6c1a7e6cd12cd4edf3cb6face
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
      - name: Restore verified dependencies only, never compiled outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: parlor-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-gradle8.13-kotlin2.4.10-xcode26.3-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify exact source and existing release security contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2e7de440eeb867e6c1a7e6cd12cd4edf3cb6face
          test "$(git rev-parse HEAD^{tree})" = 26456c5b7a9d36b807aec4d11ff4f7d615ab4c99
          test -z "$(git status --porcelain)"
          test "$(sha256sum AGENTS.md | cut -d' ' -f1)" = d9505fa9e8338a8a1ca85a63e87ffc72a4a0013468116f6f6d7a5c4c7dfbc02b
          python3 -B scripts/release/workflow_contract.py
          mkdir -p "$RUNNER_TEMP/held-protection-frontends"
      - name: Compile only the four unfinished architecture frontends
        id: compile
        run: |
          set -euo pipefail
          ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileTestKotlinIosArm64 \
            :composeApp:compileKotlinIosX64 :composeApp:compileTestKotlinIosX64 \
            --dependency-verification=strict --no-daemon --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8' \
            2>&1 | tee "$RUNNER_TEMP/held-protection-frontends/compile.log"
      - name: Preserve source and terminal compilation outcome, never claim native acceptance
        if: always()
        env:
          FRONTEND_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'held-protection-frontends'
          out.mkdir(exist_ok=True)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD', 'HEAD^{tree}'], text=True).splitlines()
          if source != ['2e7de440eeb867e6c1a7e6cd12cd4edf3cb6face', '26456c5b7a9d36b807aec4d11ff4f7d615ab4c99']:
              raise RuntimeError('Frozen implementation changed; no receipt qualification')
          log = out / 'compile.log'
          receipt = dict(source=source[0], tree=source[1], workflow_source=os.environ['GITHUB_SHA'],
              run=int(os.environ['GITHUB_RUN_ID']), attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              compilation_outcome=os.environ['FRONTEND_OUTCOME'],
              log_sha256=hashlib.sha256(log.read_bytes()).hexdigest() if log.exists() else None,
              completed_simulator_frontends_replayed=False, native_tests_executed=False,
              complete_protection_qualified=False, main_qualified=False, physical_verified=False)
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Retain frontend-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: held-protection-frontends-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/held-protection-frontends/
